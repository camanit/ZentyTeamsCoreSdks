[package]
name = "zentyteams-sdk"
version = "0.1.0"
edition = "2021"
authors = ["CTARTech Indonesia <enterprise@ctar.tech>"]
license = "AGPL-3.0-or-later"
description = "Official Rust SDK for ZentyTeamsCore — DARKINT 3-IN-1 Autonomous AI Security Platform"
repository = "https://github.com/camanit/ZentyTeamsCoreSdks"
keywords = ["security", "redteam", "blueteam", "pentest", "ai"]
categories = ["network-programming", "authentication"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
